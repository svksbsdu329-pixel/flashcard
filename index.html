<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f3" />
    <title>카드한장 — 선생님과 학생을 위한 플래시카드</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="주요 메뉴">
        <a class="brand" href="#" data-action="home" aria-label="카드한장 홈">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
          <span>카드한장</span>
        </a>

        <nav class="main-nav">
          <button class="nav-item active" data-view="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8Z"/></svg>
            홈
          </button>
          <button class="nav-item" data-view="all-cards">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
            전체 카드
          </button>
          <button class="nav-item" data-view="favorites">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
            즐겨찾기
          </button>
        </nav>

        <div class="sidebar-heading">
          <span>내 과목</span>
          <button class="icon-button small" data-action="new-subject" aria-label="새 과목 추가">+</button>
        </div>
        <div id="sidebarSubjects" class="sidebar-subjects"></div>

        <div class="sidebar-spacer"></div>
        <div class="teacher-card">
          <div class="teacher-avatar">김</div>
          <div>
            <strong>김선생님</strong>
            <span>오늘도 좋은 수업 되세요!</span>
          </div>
        </div>
        <button class="nav-item settings" data-action="open-settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21h-4v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3v-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V3h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1v4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          설정 및 백업
        </button>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="menu-button" id="menuButton" aria-label="메뉴 열기">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
            <input id="globalSearch" type="search" placeholder="카드 검색" autocomplete="off" />
            <kbd>⌘ K</kbd>
          </div>
          <button class="notification-button" aria-label="알림">
            <svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 8h18c0-1-3-1-3-8ZM10 21h4"/></svg>
            <span></span>
          </button>
        </header>

        <div id="content" class="content"></div>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
